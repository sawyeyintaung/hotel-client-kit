# Put this file in the FRONTEND (Next.js) repo at .github/workflows/docker-publish.yml
# The Dockerfile must be in the repo root.
name: Build and push frontend image

on:
  push:
    branches: [main]      # every push to main -> new "latest"
    tags: ["v*"]          # git tag v1.2.0 -> image tag 1.2.0 (for rollbacks)
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: read
  packages: write         # lets GITHUB_TOKEN push to GHCR (no personal token needed)

env:
  IMAGE_NAME: myapp-frontend   # must match docker-compose.yml on the client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner name (GHCR requires lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Browser-side API URL, baked in at build time.
          # Override in repo Settings > Secrets and variables > Actions > Variables > API_URL
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL || 'http://localhost:4000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
